server:
  port: 8082

spring:
  application:
    name: restaurant-service
  datasource:
    url: jdbc:h2:file:./data/restaurants;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

jwt:
  secret: ${JWT_SECRET:swiftbite-secret-key-2024-must-be-at-least-256-bits-long-for-hs256-alg}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
