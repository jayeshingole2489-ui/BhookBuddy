server:
  port: 8086
spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:h2:file:./data/notifications;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.swiftbite.*"
        spring.json.type.mapping: "com.swiftbite.payment.dto.PaymentEvent:com.swiftbite.notification.dto.PaymentEvent,com.swiftbite.delivery.dto.DeliveryEvent:com.swiftbite.notification.dto.DeliveryEvent,com.swiftbite.order.event.OrderEvent:com.swiftbite.notification.dto.OrderEvent"
jwt:
  secret: ${JWT_SECRET:swiftbite-secret-key-2024-must-be-at-least-256-bits-long-for-hs256-alg}
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
