server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # ─── Auth (public) ───────────────────────────────────────────────────────
        - id: user-service-auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        # ─── User service ────────────────────────────────────────────────────────
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**

        # ─── Restaurant service ──────────────────────────────────────────────────
        - id: restaurant-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/restaurants/**,/api/menu/**,/api/categories/**

        # ─── Order service ───────────────────────────────────────────────────────
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/orders/**,/api/cart/**

        # ─── Payment service ─────────────────────────────────────────────────────
        - id: payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/payments/**

        # ─── Delivery service ────────────────────────────────────────────────────
        - id: delivery-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/delivery/**

        # ─── Notification service ────────────────────────────────────────────────
        - id: notification-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/notifications/**

        # ─── Admin routes ────────────────────────────────────────────────────────
        - id: user-service-admin
          uri: http://localhost:8081
          predicates:
            - Path=/api/admin/users/**

        - id: restaurant-service-admin
          uri: http://localhost:8082
          predicates:
            - Path=/api/admin/restaurants/**,/api/admin/menu/**

        - id: order-service-admin
          uri: http://localhost:8083
          predicates:
            - Path=/api/admin/orders/**

        - id: payment-service-admin
          uri: http://localhost:8084
          predicates:
            - Path=/api/admin/payments/**

        - id: delivery-service-admin
          uri: http://localhost:8085
          predicates:
            - Path=/api/admin/deliveries/**

jwt:
  secret: ${JWT_SECRET:swiftbite-secret-key-2024-must-be-at-least-256-bits-long-for-hs256-alg}

logging:
  level:
    com.swiftbite: DEBUG
    org.springframework.cloud.gateway: DEBUG
